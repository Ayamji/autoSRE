version: '3.8'

services:
  autosre-backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: autosre-backend
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../logs:/app/logs
      - ../backend:/app/backend
      - ../automation:/app/automation
    environment:
      - FAULTY_SERVICE_URL=http://faulty-service:8080/health
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=autosre-backend
    env_file:
      - ../backend/.env
    restart: unless-stopped
    networks:
      - sre_net

  faulty-service:
    build:
      context: ./faulty_service
    container_name: faulty-service
    ports:
      - "8080:8080"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=faulty-service
    restart: always
    networks:
      - sre_net

  order-backend:
    build:
      context: ./order_backend
    container_name: order-backend
    ports:
      - "8082:8082"
    environment:
      - PAYMENT_SERVICE_URL=http://faulty-service:8080/health
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=order-backend
    depends_on:
      - faulty-service
    restart: always
    networks:
      - sre_net

  shop-frontend:
    build:
      context: ./shop_frontend
    container_name: shop-frontend
    ports:
      - "8081:8081"
    environment:
      - ORDER_SERVICE_URL=http://order-backend:8082/order
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=shop-frontend
    depends_on:
      - order-backend
    restart: always
    networks:
      - sre_net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - sre_net

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - sre_net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ../logs:/var/log
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - sre_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - sre_net
    depends_on:
      - prometheus
      - loki

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - sre_net

networks:
  sre_net:
    driver: bridge
